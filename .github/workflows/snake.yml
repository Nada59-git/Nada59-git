name: Generate Green Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                # regenerates whenever you push to main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate green snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/green-snake.svg?color_snake=%2316A34A&color_dots=%23ECFDF5,%23BBF7D0,%2386EFAC,%2334D399,%23059669
            dist/green-snake-dark.svg?color_snake=%2334D399&color_dots=%230B1F17,%23064E3B,%23065F46,%23059669,%2334D399&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated SVG to the "output" branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
